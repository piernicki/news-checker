[project]
name = "news-checker"
dynamic = ["version"]
description = "Monitoring of online mentions of a person and their projects: search engines, Telegram channels, LLM filtering, Telegram reports"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "apscheduler>=3.10,<4",
    "anthropic>=2.8.0",
    "selectolax>=1.0.2",
]

[project.scripts]
news-checker = "news_checker.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
# Version comes from the git tag (v1.2.3 -> 1.2.3). Without git metadata (e.g. a Docker build) set
# SETUPTOOLS_SCM_PRETEND_VERSION; otherwise the fallback is used.
source = "vcs"
raw-options = { fallback_version = "0.0.0" }

[tool.hatch.build.targets.wheel]
packages = ["src/news_checker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
